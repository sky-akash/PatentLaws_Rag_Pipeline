<html><head><meta content="/en/legal/guidelines-epc/2026/f_ii_4_6.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="4.6 Rule 42(1)(c) vs Art. 52(1)" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination, Patentable inventions" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/f.html","title":"Part F"},{"alias":"/en/legal/guidelines-epc/2026/f_ii.html","title":"Chapter II"},{"alias":"/en/legal/guidelines-epc/2026/f_ii_4.html","title":"4. Description (formal requirements)"},{"alias":"/en/legal/guidelines-epc/2026/f_ii_4_6.html","title":"4.6 Rule 42(1)(c) vs Art. 52(1)"}]' name="breadcrumb_json"/></head><body><h1 class="h2">4.6 <a href="/en/legal/epc/2020/r42.html">Rule 42(1)(c)</a> vs <a href="/en/legal/epc/2020/a52.html">Art. 52(1)</a> </h1><div class="epolegal-content" id="GLF_CII_4_6"><div class="DOC4NET2_Frame"><div class="DOC4NET2_Frame_Inner"><div class="DOC4NET2_Frame_Text"><p>If it is decided that an independent claim defines a patentable invention within the meaning of <a href="/en/legal/epc/2020/a52.html" title="Article 52 Patentable inventions">Art. 52(1)</a>, it must be possible to derive a technical problem from the application. If so, the requirement of <a href="/en/legal/epc/2020/r42.html" title="Rule 42 Content of the description">Rule 42(1)(c)</a> is fulfilled (see <a href="https://www.epo.org/law-practice/case-law-appeals/recent/t810026ex1.html">T 26/81</a>).</p>
</div><div class="DOC4NET2_Frame_Margin"><p><a class="icon-link_internal" href="/en/legal/epc/2020/r42.html" title="Rule 42 Content of the description">Rule 42(1)(c)</a></p>
