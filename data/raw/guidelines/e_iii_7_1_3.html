<html><head><meta content="/en/legal/guidelines-epc/2026/e_iii_7_1_3.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="7.1.3 Change of date of oral proceedings – defined notice period" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/e.html","title":"Part E"},{"alias":"/en/legal/guidelines-epc/2026/e_iii.html","title":"Chapter III"},{"alias":"/en/legal/guidelines-epc/2026/e_iii_7.html","title":"7. Change of date, cancellation or maintenance of oral proceedings"},{"alias":"/en/legal/guidelines-epc/2026/e_iii_7_1.html","title":"7.1 Changing the date of oral proceedings"},{"alias":"/en/legal/guidelines-epc/2026/e_iii_7_1_3.html","title":"7.1.3 Change of date of oral proceedings"}]' name="breadcrumb_json"/></head><body><h1 class="h2">7.1.3 Change of date of oral proceedings – defined notice period  </h1><div class="epolegal-content" id="GLE_CIII_7_1_3"><p>The notice period defined in <a href="/en/legal/epc/2020/r115.html" title="Rule 115 Summons to oral proceedings">Rule 115(1)</a>, i.e. at least two months, also applies in the case of a change of date unless the parties have agreed to a shorter period (see also <a href="e_iii_6.html" title="6. Summons to oral proceedings">E‑III, 6(iii)</a> and <a href="e_iii_8_11_1.html" title="8.11.1 Requesting postponement during oral proceedings">E‑III, 8.11.1</a>).</p>
</div></body></html>
