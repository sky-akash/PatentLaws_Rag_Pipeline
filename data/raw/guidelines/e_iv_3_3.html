</div><div class="DOC4NET2_Frame_Margin"><p><a class="icon-link_internal" href="/en/legal/epc/2020/r150.html" title="Rule 150 Procedure for letters rogatory">Rule 150(2)</a></p>
</div></div></div><div class="DOC4NET2_Frame"><div class="DOC4NET2_Frame_Inner"><div class="DOC4NET2_Frame_Text"><p>Letters rogatory must be addressed to the central authority designated by the contracting state.</p>
</div><div class="DOC4NET2_Frame_Margin"><p><a class="icon-link_internal" href="/en/legal/epc/2020/r150.html" title="Rule 150 Procedure for letters rogatory">Rule 150(1)</a></p>
