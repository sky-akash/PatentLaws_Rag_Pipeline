<html><head><meta content="/en/legal/guidelines-epc/2026/d_iii_3_3.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="3.3 Notices of opposition filed by fax" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination, Filing of and formal requirements for documents" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/d.html","title":"Part D"},{"alias":"/en/legal/guidelines-epc/2026/d_iii.html","title":"Chapter III"},{"alias":"/en/legal/guidelines-epc/2026/d_iii_3.html","title":"3. Submission in writing"},{"alias":"/en/legal/guidelines-epc/2026/d_iii_3_3.html","title":"3.3 Notices of opposition filed by fax"}]' name="breadcrumb_json"/></head><body><h1 class="h2">3.3 Notices of opposition filed by fax  </h1><div class="epolegal-content" id="GLD_CIII_3_3"><div class="DOC4NET2_Frame"><div class="DOC4NET2_Frame_Inner"><div class="DOC4NET2_Frame_Text"><p>Since 1 July 2024, notices of opposition may not be filed by fax (see the decision of the President of the EPO dated 22 April 2024, <a href="/en/legal/official-journal/2024/04/a41.html" title="Decision of the President of the European Patent Office dated 22 April 2024 concerning the abolition of facsimile (fax) as a means of filing patent applications and other documents">OJ EPO 2024, A41</a>). Any documents transmitted to the EPO by fax are deemed not to have been received.</p>
</div><div class="DOC4NET2_Frame_Margin"><p><a class="icon-link_internal" href="/en/legal/epc/2020/r2.html" title="Rule 2 Filing of and formal requirements for documents">Rule 2</a></p>
</div></div></div></div></body></html>
