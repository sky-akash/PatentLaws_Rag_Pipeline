<html><head><meta content="/en/legal/guidelines-epc/2026/a_x_6_1.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="6.1 Basic principle" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination, Date considered as date on which payment is made, Extension of periods" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/a.html","title":"Part A"},{"alias":"/en/legal/guidelines-epc/2026/a_x.html","title":"Chapter X"},{"alias":"/en/legal/guidelines-epc/2026/a_x_6.html","title":"6. Payment in due time"},{"alias":"/en/legal/guidelines-epc/2026/a_x_6_1.html","title":"6.1 Basic principle"}]' name="breadcrumb_json"/></head><body><h1 class="h2">6.1 Basic principle  </h1><div class="epolegal-content" id="GLA_CX_6_1"><p>A fee is considered to have been paid in due time if the date of payment (see <a href="a_x_4.html" title="4. Date considered as date on which payment is made">A‑X, 4</a>) fell on or before the last day of the relevant time limit – or the time limit extended under <a href="/en/legal/epc/2020/r134.html" title="Rule 134 Extension of periods">Rule 134</a>.</p>
