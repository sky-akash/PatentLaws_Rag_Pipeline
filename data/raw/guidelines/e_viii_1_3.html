<html><head><meta content="/en/legal/guidelines-epc/2026/e_viii_1_3.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="1.3 Time limits which may be freely determined" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/e.html","title":"Part E"},{"alias":"/en/legal/guidelines-epc/2026/e_viii.html","title":"Chapter VIII"},{"alias":"/en/legal/guidelines-epc/2026/e_viii_1.html","title":"1. Time limits and loss of rights resulting from failure to respond within a time limit"},{"alias":"/en/legal/guidelines-epc/2026/e_viii_1_3.html","title":"1.3 Time limits which may be freely determined"}]' name="breadcrumb_json"/></head><body><h1 class="h2">1.3 Time limits which may be freely determined  </h1><div class="epolegal-content" id="GLE_CVIII_1_3"><p>Time limits for acts for which the setting of a time limit is not explicitly provided for in the EPC are not subject to the restrictions on the duration of time limits laid down in <a href="/en/legal/epc/2020/r132.html" title="Rule 132 Periods specified by the European Patent Office">Rule 132</a>. They may be fixed by the EPO at its own discretion.</p>
