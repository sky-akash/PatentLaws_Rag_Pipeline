 admitted and/or not allowable, examination resumed">C‑V, 4.7</a> and <a href="c_v_4_6_2.html" title="4.6.2 Second Rule 71(3) communication based on higher-ranking request initially rejected in first Rule 71(3) communication">C‑V, 4.6.2</a>).</p>
