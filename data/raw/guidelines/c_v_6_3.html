<html><head><meta content="/en/legal/guidelines-epc/2026/c_v_6_3.html" name="currentmenuurl"/><meta class="elastic" content="guidelines-epc" name="publicationtype"/><meta class="elastic" content="2026-03-31" name="date_publication"/><meta class="elastic" content="6.3 Crediting of fees under Rule 71a(5)" name="title"/><meta class="elastic" content="" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, GL/EPO,Guidelines for Examination" name="keywords"/><meta class="elastic" content="section" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/guidelines-epc","title":"Guidelines for Examination"},{"alias":"/en/legal/guidelines-epc/2026/index.html","title":"Table of Contents"},{"alias":"/en/legal/guidelines-epc/2026/c.html","title":"Part C"},{"alias":"/en/legal/guidelines-epc/2026/c_v.html","title":"Chapter V"},{"alias":"/en/legal/guidelines-epc/2026/c_v_6.html","title":"6. The examining division resumes examination after approval of the text"},{"alias":"/en/legal/guidelines-epc/2026/c_v_6_3.html","title":"6.3 Crediting of fees under Rule 71a(5)"}]' name="breadcrumb_json"/></head><body><h1 class="h2">6.3 Crediting of fees under <a href="/en/legal/epc/2020/r71a.html">Rule 71a(5)</a> </h1><div class="epolegal-content" id="GLC_CV_6_3"><div class="DOC4NET2_Frame"><div class="DOC4NET2_Frame_Inner"><div class="DOC4NET2_Frame_Text"><p>If, in response to an invitation under <a href="/en/legal/epc/2020/r71.html" title="Rule 71 , Examination procedure">Rule 71(3)</a>, the applicant has already paid the fee for grant and publishing or the claims fees, the amount paid will be credited if a further such invitation is issued. For more details, see <a href="a_x_11.html" title="11. Crediting of fees under Rule 71a(5)">A‑X, 11</a>.</p>
