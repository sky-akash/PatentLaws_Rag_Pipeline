<html><head><meta content="/en/legal/epc/2020/a74.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Article 74 – Law applicable" name="title"/><meta class="elastic" content="EPC Convention" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Article, Art, European patent application as an object of property" name="keywords"/><meta class="elastic" content="article" name="pagetype"/><meta class="elastic" content="Part II – Substantive patent law" name="parttitle"/><meta class="elastic" content="Chapter IV – The European patent application as an object of property" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/convention.html","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/apii.html","title":"Part II"},{"alias":"/en/legal/epc/2020/acii_iv.html","title":"Chapter IV"},{"alias":"/en/legal/epc/2020/a74.html","title":"Article 74"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="A74"></a>Article 74<br/>Law applicable</h1><div class="epolegal-content" id="A74"><p>Unless this Convention provides otherwise, the European patent application as an object of property shall, in each designated Contracting State and with effect for such State, be subject to the law applicable in that State to national patent applications.</p></div></body></html>
