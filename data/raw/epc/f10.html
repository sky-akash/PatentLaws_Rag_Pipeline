<html><head><meta content="/en/legal/epc/2020/f10.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Article 10 – Refund of the fee for a technical opinion" name="title"/><meta class="elastic" content="EPC Rules relating to Fees" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Rules relating to Fees,RFees,RRF" name="keywords"/><meta class="elastic" content="article" name="pagetype"/><meta class="elastic" content="" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/rfees.html","title":"Rules relating to Fees"},{"alias":"/en/legal/epc/2020/f10.html","title":"Article 10"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="10"></a>Article 10 <br/>Refund of the fee for a technical opinion</h1><div class="epolegal-content" id="10"><p>An amount of 75% of the fee for a technical opinion under <a href="a25.html" title="Article 25 Technical opinion">Article 25 of the Convention</a> shall be refunded if the request for a technical opinion is withdrawn at a time when the Office has not yet begun to draw up the technical opinion.</p></div></body></html>
