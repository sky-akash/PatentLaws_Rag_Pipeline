<html><head><meta content="/en/legal/epc/2020/a34.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Article 34 – Voting rights" name="title"/><meta class="elastic" content="EPC Convention" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Article, Art" name="keywords"/><meta class="elastic" content="article" name="pagetype"/><meta class="elastic" content="Part I – General and institutional provisions" name="parttitle"/><meta class="elastic" content="Chapter IV – The Administrative Council" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/convention.html","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/api.html","title":"Part I"},{"alias":"/en/legal/epc/2020/aci_iv.html","title":"Chapter IV"},{"alias":"/en/legal/epc/2020/a34.html","title":"Article 34"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="A34"></a>Article 34<br/>Voting rights</h1><div class="epolegal-content" id="A34"><p class="prefixed"><span class="LM_Normal_p1"><a id="A34_1"></a>(1) </span><span>The right to vote in the Administrative Council shall be restricted to the Contracting States. </span></p>
