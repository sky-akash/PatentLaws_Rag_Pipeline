<html><head><meta content="/en/legal/epc/2020/a85.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Article 85 – Abstract" name="title"/><meta class="elastic" content="EPC Convention" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Article, Art, Form and content of the abstract, Definitive content of the abstract, Abstract in examination" name="keywords"/><meta class="elastic" content="article" name="pagetype"/><meta class="elastic" content="Part III – The European patent application" name="parttitle"/><meta class="elastic" content="Chapter I – Filing and requirements of the European patent application" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/convention.html","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/apiii.html","title":"Part III"},{"alias":"/en/legal/epc/2020/aciii_i.html","title":"Chapter I"},{"alias":"/en/legal/epc/2020/a85.html","title":"Article 85"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="A85"></a>Article 85<br/>Abstract</h1><div class="epolegal-content" id="A85"><p>The abstract shall serve the purpose of technical information only; it may not be taken into account for any other purpose, in particular for interpreting the scope of the protection sought or applying <a href="a54.html" title="Article 54 Novelty">Article 54, paragraph 3</a>.</p></div></body></html>
