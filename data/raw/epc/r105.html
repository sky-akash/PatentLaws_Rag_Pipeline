<html><head><meta content="/en/legal/epc/2020/r105.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Rule 105 – Criminal acts" name="title"/><meta class="elastic" content="EPC Implementing Regulations" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Implementing Regulations, Rule, Criminal act having an impact on a decision" name="keywords"/><meta class="elastic" content="rule" name="pagetype"/><meta class="elastic" content="Part VI – Implementing Regulations to Part VI of the Convention" name="parttitle"/><meta class="elastic" content="Chapter II – Petitions for review by the Enlarged Board of Appeal" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/regulations.html","title":"Implementing Regulations"},{"alias":"/en/legal/epc/2020/rpvi.html","title":"Part VI"},{"alias":"/en/legal/epc/2020/rcvi_ii.html","title":"Chapter II"},{"alias":"/en/legal/epc/2020/r105.html","title":"Rule 105"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="R105"></a>Rule 105<br/>Criminal acts</h1><div class="epolegal-content" id="R105"><p>A petition for review may be based on <a href="a112a.html" title="Article 112a Petition for review by the Enlarged Board of Appeal">Article 112a, paragraph 2(e)</a>, if a competent court or authority has finally established that the criminal act occurred; a conviction is not necessary. </p></div></body></html>
