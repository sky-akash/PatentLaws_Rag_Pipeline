<html><head><meta content="/en/legal/epc/2020/a174.html" name="currentmenuurl"/><meta class="elastic" content="epc" name="publicationtype"/><meta class="elastic" content="2026-05-21" name="date_publication"/><meta class="elastic" content="Article 174 – Denunciation" name="title"/><meta class="elastic" content="EPC Convention" name="booktitle"/><meta class="elastic" content="EPO,European Patent Office, legal, EPC, European Patent Convention, Article, Art" name="keywords"/><meta class="elastic" content="article" name="pagetype"/><meta class="elastic" content="Part XII – Final provisions" name="parttitle"/><meta class="elastic" content="" name="chaptertitle"/><meta class="elastic" content='[{"alias":"/en/legal","title":"Legal texts"},{"alias":"/en/legal/epc","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/index.html","title":"Contents"},{"alias":"/en/legal/epc/2020/convention.html","title":"European Patent Convention"},{"alias":"/en/legal/epc/2020/apxii.html","title":"Part XII"},{"alias":"/en/legal/epc/2020/a174.html","title":"Article 174"}]' name="breadcrumb_json"/></head><body><h1 class="h2"><a id="A174"></a>Article 174<br/>Denunciation</h1><div class="epolegal-content" id="A174"><p>Any Contracting State may at any time denounce this Convention. Denunciation shall be notified to the Government of the Federal Republic of Germany. It shall take effect one year after the date of receipt of such notification.</p></div></body></html>
