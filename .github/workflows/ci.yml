name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the tests use saved EPO pages, a hashing embedder and a fake LLM: no network, no Ollama, no API key
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patentlaw .
      - name: smoke test (empty index, no key)
        run: |
          docker run -d -p 8010:8010 --name pl patentlaw
          for i in $(seq 1 30); do curl -sf localhost:8010/api/health && break; sleep 1; done
          curl -sf localhost:8010/api/health | grep -q '"status"'
          curl -sf localhost:8010/ | grep -q "Patent Law Navigator"
